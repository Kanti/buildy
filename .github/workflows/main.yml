name: ci

on:
  schedule:
    # build every day
    - cron: '0 0 * * *'
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        include:
          # includes new variables for specific matrix legs
          - php: '8.5'
            additionalTag: ',kanti/buildy:latest'
          # build from php:8.6-rc-alpine until php:8.6-alpine is released, then switch automatically
          - php: '8.6'
            rc: true
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      -
        if: github.ref == 'refs/heads/master'
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        if: matrix.rc
        name: Use release candidate until ${{ matrix.php }} is released
        id: rc
        run: |
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' https://hub.docker.com/v2/namespaces/library/repositories/php/tags/${{ matrix.php }}-alpine)
          case "$status" in
            200) echo "php=${{ matrix.php }}" >> "$GITHUB_OUTPUT" ;;
            404) echo "php=${{ matrix.php }}-rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Docker Hub returned HTTP $status for php:${{ matrix.php }}-alpine"; exit 1 ;;
          esac
      -
        name: Build ${{ matrix.php }} for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: buildy:smoke-test-amd64
          build-args: PHP=${{ steps.rc.outputs.php || matrix.php }}
          platforms: linux/amd64
      -
        name: Build ${{ matrix.php }} for smoke test (arm64)
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: buildy:smoke-test-arm64
          build-args: PHP=${{ steps.rc.outputs.php || matrix.php }}
          platforms: linux/arm64
      -
        name: Smoke test ${{ matrix.php }}
        run: |
          cat > "$RUNNER_TEMP/smoke-test.sh" <<'EOF'
          cd "$(mktemp -d)"
          [ "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "$EXPECTED_PHP" ]
          # one check per entry in README.md
          # php extensions
          echo '<?php function f() {}' > f.php
          php -d pcov.directory=. -r '\pcov\start(); require "f.php"; f(); exit(\pcov\collect() ? 0 : 1);'
          php -r 'exit(imagepng(imagecreatetruecolor(1, 1), "image.png") ? 0 : 1);'
          php -r 'exit(in_array("mysql", PDO::getAvailableDrivers()) ? 0 : 1);'
          php -r 'exit((new PDO("sqlite::memory:"))->query("SELECT 1")->fetchColumn() == 1 ? 0 : 1);'
          php -r 'exit(mysqli_init() ? 0 : 1);'
          php -r 'new SoapClient(null, ["location" => "http://localhost", "uri" => "urn:smoke"]);'
          php -r '$zip = new ZipArchive(); $zip->open("a.zip", ZipArchive::CREATE); $zip->addFromString("a.txt", "a"); exit($zip->close() ? 0 : 1);'
          php -r 'exit((new NumberFormatter("en_US", NumberFormatter::DECIMAL))->format(1234.5) === "1,234.5" ? 0 : 1);'
          php -r 'exit(cal_days_in_month(CAL_GREGORIAN, 2, 2024) === 29 ? 0 : 1);'
          # tools
          git init -q
          git -c user.name=smoke -c user.email=smoke@test commit -q --allow-empty -m smoke
          [[ "$(composer --version 2>/dev/null)" == *"Composer version 2."* ]]
          [ "$(magick identify -format '%wx%h' image.png)" = "1x1" ]
          docker --version
          docker compose version
          echo '{"a": 1}' | jq -e '.a == 1'
          rsync -a f.php copy.php
          ssh -V
          [ "$(unzip -p a.zip a.txt)" = "a" ]
          patch --version
          [[ "$(file -b image.png)" == PNG* ]]
          [ "$(php -r 'echo ini_get("memory_limit");')" = "-1" ]
          EOF
          for arch in amd64 arm64; do
            docker run --rm -i --platform linux/$arch -e EXPECTED_PHP=${{ matrix.php }} buildy:smoke-test-$arch bash -euxo pipefail < "$RUNNER_TEMP/smoke-test.sh"
          done
      -
        name: Build and push ${{ matrix.php }}
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: kanti/buildy:${{ matrix.php }},kanti/buildy:${{ matrix.php }}-${{ steps.date.outputs.date }}${{ matrix.additionalTag }}
          build-args: PHP=${{ steps.rc.outputs.php || matrix.php }}
          platforms: linux/amd64,linux/arm64

  dockerhub-description:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      -
        name: Sync README.md to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kanti/buildy
          short-description: 'Small PHP Docker image (Alpine) for CI builds: composer, pcov, git, imagemagick and docker cli'
