name: ci

on:
  schedule:
    # build every day
    - cron: '0 0 * * *'
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5', '8.6' ]
        include:
          # includes new variables for specific matrix legs
          - php: '8.5'
            additionalTag: ',kanti/buildy:latest'
          # build from php:8.6-rc-alpine until php:8.6-alpine is released, then switch automatically
          - php: '8.6'
            rc: true
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      -
        if: github.ref == 'refs/heads/master'
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        if: matrix.rc
        name: Use release candidate until ${{ matrix.php }} is released
        id: rc
        run: |
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' https://hub.docker.com/v2/namespaces/library/repositories/php/tags/${{ matrix.php }}-alpine)
          case "$status" in
            200) echo "php=${{ matrix.php }}" >> "$GITHUB_OUTPUT" ;;
            404) echo "php=${{ matrix.php }}-rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Docker Hub returned HTTP $status for php:${{ matrix.php }}-alpine"; exit 1 ;;
          esac
      -
        name: Build ${{ matrix.php }} for smoke test
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: buildy:smoke-test
          build-args: PHP=${{ steps.rc.outputs.php || matrix.php }}
          platforms: linux/amd64
      -
        name: Smoke test ${{ matrix.php }}
        run: |
          docker run --rm -i -e EXPECTED_PHP=${{ matrix.php }} buildy:smoke-test bash -euxo pipefail <<'EOF'
          cd "$(mktemp -d)"
          [ "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "$EXPECTED_PHP" ]
          # one check per feature in README.md
          git init -q
          git -c user.name=smoke -c user.email=smoke@test commit -q --allow-empty -m smoke
          [[ "$(composer --version 2>/dev/null)" == *"Composer version 2."* ]]
          echo '<?php function f() {}' > f.php
          php -d pcov.directory=. -r '\pcov\start(); require "f.php"; f(); exit(\pcov\collect() ? 0 : 1);'
          magick -size 1x1 xc:red image.png
          php -r 'exit(imagepng(imagecreatefrompng("image.png"), "gd.png") ? 0 : 1);'
          php -r 'exit(in_array("mysql", PDO::getAvailableDrivers()) ? 0 : 1);'
          php -r 'exit((new PDO("sqlite::memory:"))->query("SELECT 1")->fetchColumn() == 1 ? 0 : 1);'
          EOF
      -
        name: Build and push ${{ matrix.php }}
        id: docker_build_latest
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: kanti/buildy:${{ matrix.php }},kanti/buildy:${{ matrix.php }}-${{ steps.date.outputs.date }}${{ matrix.additionalTag }}
          build-args: PHP=${{ steps.rc.outputs.php || matrix.php }}
          platforms: linux/amd64,linux/arm64
      -
        name: Image digest
        run: |
          echo ${{ steps.docker_build.outputs.digest }}
          echo ${{ steps.docker_build_dev.outputs.digest }}
