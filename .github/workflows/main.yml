name: ci

on:
  schedule:
    # build every first of the month
    - cron: '0 0 1 * *'
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
        include:
          # includes new variables for specific matrix legs
          - php: '8.4'
            additionalTag: ',kanti/buildy:latest'
          - php: '8.6-rc'
            # provide a cleaned php version to be used in tags (no -rc)
            cleanPhp: '8.6'
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      -
        if: github.ref == 'refs/heads/master'
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push ${{ matrix.php }}
        id: docker_build_latest
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: kanti/buildy:${{ matrix.cleanPhp || matrix.php }},kanti/buildy:${{ matrix.cleanPhp || matrix.php }}-${{ steps.date.outputs.date }}${{ matrix.additionalTag }}
          build-args: PHP=${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
      -
        name: Image digest
        run: |
          echo ${{ steps.docker_build.outputs.digest }}
          echo ${{ steps.docker_build_dev.outputs.digest }}
